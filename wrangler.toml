name = "home-meters"
main = "src/index.js"
compatibility_date = "2026-11-01"
# keep variables set in the Cloudflare dashboard (APP_PASSWORD) on every deploy
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# KV namespace "verbrauch-expert".
# binding must stay "STATE": it is the variable name the code uses (env.STATE),
# not the namespace's name.
[[kv_namespaces]]
binding = "STATE"
id = "09133ec43a6d4c16af62ea865b7292ac"

# APP_PASSWORD: set it in the dashboard (Settings -> Variables and Secrets),
# as Text or Secret. Do NOT put it in this file: the repo is public on GitHub.
