name = "home-meters"
main = "src/index.js"
compatibility_date = "2026-11-01"
# keep variables set in the Cloudflare dashboard (APP_PASSWORD) on every deploy
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 1) npx wrangler kv namespace create STATE
# 2) paste the printed id below
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# APP_PASSWORD: set it in the dashboard (Settings -> Variables and Secrets),
# as Text or Secret. Do NOT put it in this file: the repo is public on GitHub.
