name = "home-meters"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 1) npx wrangler kv namespace create STATE
# 2) paste the printed id below
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (not stored in this file):
#   npx wrangler secret put API_TOKEN
