<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<title>Дом: счётчики и расходы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ---- tokens: design-system/home-meters/MASTER.md ---- */
:root{
  --bg:#F4F6FA;--surface:#FFFFFF;--surface-2:#EEF2F7;--text:#0F172A;--text-2:#475569;--border:#E2E8F0;--field:#CBD5E1;
  --primary:#1E40AF;--on-primary:#FFFFFF;--good:#047857;--bad:#B91C1C;--warn:#B45309;--ring:#1E40AF;
  --drum:#111827;--drum-text:#F9FAFB;--drum-red:#B91C1C;
  --s-rent:#6D28D9;--s-nk:#0E7490;--s-power:#1D4ED8;--s-water:#0891B2;--s-oil:#C2410C;
  --font:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Fira Code',ui-monospace,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F172A;--surface:#192134;--surface-2:#101A34;--text:#F1F5F9;--text-2:#94A3B8;--border:rgba(255,255,255,.08);--field:rgba(255,255,255,.22);
  --primary:#60A5FA;--on-primary:#0F172A;--good:#34D399;--bad:#F87171;--warn:#FBBF24;--ring:#FFFFFF;
  --drum:#05080F;--drum-text:#F9FAFB;--drum-red:#991B1B;
  --s-rent:#A78BFA;--s-nk:#22D3EE;--s-power:#60A5FA;--s-water:#67E8F9;--s-oil:#FB923C;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font);font-variant-numeric:tabular-nums lining-nums}
.num{font-variant-numeric:tabular-nums lining-nums}
main{max-width:760px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* header + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 8px}
.top h1{font-size:22px;line-height:28px;font-weight:700;margin:0;letter-spacing:-.01em}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:8px 16px;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:500 15px/1 var(--font);white-space:nowrap;cursor:pointer;transition:background-color .15s,color .15s}
.tab[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
#status{min-height:20px;margin:4px 0 8px;font-size:14px;line-height:20px;color:var(--text-2)}
#status.err{color:var(--bad)}

/* blocks */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:17px;line-height:24px;font-weight:600;margin:0 0 12px}
.cap{font-size:14px;line-height:20px;color:var(--text-2);font-weight:500}
.note{font-size:14px;line-height:20px;color:var(--text-2);margin:12px 0 0}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

/* hero: mechanical counter */
.hero{display:flex;flex-direction:column;gap:12px}
.odo-row{display:flex;align-items:flex-end;gap:10px}
.odo{display:inline-flex;gap:3px;padding:6px;background:#0B0F19;border-radius:10px;flex:none}
.odo span{display:grid;place-items:center;width:clamp(28px,8.2vw,40px);height:clamp(42px,12vw,56px);background:linear-gradient(var(--drum) 0 46%,#000 46% 54%,var(--drum) 54%);border-radius:4px;color:var(--drum-text);font:600 clamp(22px,6.8vw,32px)/1 var(--mono);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.4)}
.odo span.red{background:linear-gradient(var(--drum-red) 0 46%,#5b0d0d 46% 54%,var(--drum-red) 54%)}
.odo-u{font:600 17px/1 var(--font);color:var(--text-2);padding-bottom:8px}
.hero-meta{display:flex;flex-wrap:wrap;gap:4px 16px}
.hero-meta b{font-weight:600}

/* forms */
form.entry{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.entry .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;line-height:20px;font-weight:500;color:var(--text-2)}
input,select{font:400 16px/24px var(--font);font-variant-numeric:tabular-nums;width:100%;min-height:48px;padding:11px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--text)}
input::placeholder{color:var(--text-2);opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--primary);color:var(--on-primary);font:600 16px/1 var(--font);cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.85}
.btn.secondary{background:var(--surface-2);color:var(--text)}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;margin:-10px -8px -10px 0;border:0;background:none;color:var(--text-2);border-radius:10px;cursor:pointer}
.icon-btn.confirm{width:auto;padding:0 10px;color:var(--bad);font:600 14px/1 var(--font)}
.link{background:none;border:0;padding:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:44px}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
input:focus-visible{outline-offset:0}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--primary)}

/* figures: one card, hairline cells */
.figs{display:grid;grid-template-columns:1fr 1fr;padding:0;overflow:hidden}
.fig{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px;min-width:0}
.fig:nth-child(odd){border-right:1px solid var(--border)}
.fig:nth-last-child(-n+2):nth-child(odd),.fig:last-child{border-bottom:0}
.fig .v{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.01em;margin:2px 0}
.fig .v small{font-size:16px;font-weight:500}
.fig .v.word{font-size:22px;line-height:28px}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--primary);border-radius:4px}
@media (min-width:720px){.figs{grid-template-columns:repeat(4,1fr)}.fig{border-bottom:0;border-right:1px solid var(--border)}.fig:last-child{border-right:0}}

/* tables */
.tbl{overflow-x:auto;margin:0 -16px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 16px 12px 0;text-align:right;font-size:16px;line-height:22px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th{font-size:14px;line-height:20px;font-weight:500;color:var(--text-2);border-bottom:1px solid var(--border)}
td{border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
td.t{text-align:left;white-space:normal;color:var(--text-2);font-size:15px}
tr.total td{font-weight:600}
.empty{color:var(--text-2);font-size:15px;padding:4px 0}

/* oil tank */
.tank-wrap{display:flex;gap:16px;align-items:stretch}
.tank{width:64px;min-height:132px;border:2px solid var(--text-2);border-radius:12px;position:relative;overflow:hidden;flex:none}
.tank i{position:absolute;left:0;right:0;bottom:0;background:var(--s-oil);opacity:.9}
.tank b{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--text);text-shadow:0 0 6px var(--surface)}

/* payment strip */
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mo{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:10px;border:1px solid var(--border);font-size:14px;font-weight:500;color:var(--text-2)}
.mo .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1.5px dashed var(--field)}
.mo.paid{color:var(--text)}
.mo.paid .ic{background:var(--good);border:0;color:var(--surface)}
.mo.paid .ic svg{stroke:var(--surface);width:18px;height:18px}
.mo.now{border-color:var(--primary);border-width:2px}

/* summary composition */
.lead{font-size:22px;line-height:30px;font-weight:600;margin:0 0 14px}
.lead .num{font-size:30px}
.comp{display:flex;height:20px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2)}
.comp i{display:block;height:100%}
.legend{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.legend li{display:flex;align-items:center;gap:10px;font-size:16px}
.legend li span:nth-child(2){flex:1}
.sw{width:12px;height:12px;border-radius:3px;flex:none}

details>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;cursor:pointer;font-weight:600;font-size:17px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--text-2);border-bottom:2px solid var(--text-2);transform:rotate(45deg);margin:0 6px 4px}
details[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 16px}
.set .full{grid-column:1/-1}
.login{max-width:380px;margin:12vh auto 0}
@media (max-width:380px){form.entry,.set{grid-template-columns:1fr}.fig .v{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Дом: счётчики и расходы</h1><span id="hdr"></span></div>
<nav class="tabs" id="tabs" aria-label="Разделы"></nav>
<div id="status" role="status" aria-live="polite"></div>
<div id="view"></div>
</main>

<script id="state" type="application/json">{"v":2,"meters":{"power":{"name":"Электричество","unit":"кВт·ч","price":28.11,"priceUnit":"ct","base":190.11,"norm":3500,"abs":98,"nk":false,"readings":[["2026-06-23",3845],["2026-10-10",4849],["2026-10-31",5052],["2026-11-23",5229]]},"water":{"name":"Вода (холодная)","unit":"м³","price":4.5,"priceUnit":"eur","base":0,"norm":0,"abs":0,"nk":true,"readings":[]}},"oil":{"tankL":3000,"heightCm":150,"nk":false,"entries":[]},"nk":{"monthly":0,"payments":[]},"rent":{"monthly":0,"payments":[]}}</script>

<script>
let S = JSON.parse(document.getElementById('state').textContent);
let tab = 'sum', chart, REV = 0;
try { if (location.hash) tab = location.hash.slice(1); } catch(e){}
const $ = id => document.getElementById(id);
const DAY = 864e5;
const MON = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const MONF = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); };
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmt = (n,d=0) => (isFinite(n)?n:0).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur = (n,d=0) => fmt(n,d)+' €';
const fd = s => { const [y,m,d]=s.split('-'); return `${d}.${m}.${y.slice(2)}`; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ym = t => { const d=new Date(t); return d.getUTCFullYear()*12+d.getUTCMonth(); };
const ymLabel = k => MON[k%12]+' '+String(Math.floor(k/12)).slice(2);
const dim = k => new Date(Date.UTC(Math.floor(k/12),k%12+1,0)).getUTCDate();
const nowK = () => ym(pd(today()));
const plural = (n,a,b,c) => { n=Math.abs(Math.round(n))%100; const m=n%10; return n>10&&n<20?c:m===1?a:m>=2&&m<=4?b:c; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* Lucide icons */
const IC = {
  sum:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  power:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  water:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  oil:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  rent:'<path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>',
  nk:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  out:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
  check:'<path d="M20 6 9 17l-5-5"/>'
};
const icon = (k,label) => `<svg class="i" viewBox="0 0 24 24" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>${IC[k]}</svg>`;

function norm(){
  S.meters = S.meters || {};
  S.meters.power = S.meters.power || {name:'Электричество',unit:'кВт·ч',price:0,priceUnit:'ct',base:0,norm:0,abs:0,nk:false,readings:[]};
  S.meters.water = S.meters.water || {name:'Вода (холодная)',unit:'м³',price:0,priceUnit:'eur',base:0,norm:0,abs:0,nk:true,readings:[]};
  S.oil = S.oil || {tankL:3000,heightCm:150,nk:false,entries:[]};
  S.nk = S.nk || {monthly:0,payments:[]};
  S.rent = S.rent || {monthly:0,payments:[]};
}

/* ---------- calculations (unchanged logic) ---------- */
function toMonths(segs, forecastRate){
  const m = new Map(); if (!segs.length) return [];
  const start = segs[0].t0, end = segs[segs.length-1].t1;
  let i = 0;
  for (let t=start; t<end; t+=DAY){
    while (t>=segs[i].t1) i++;
    const k=ym(t); if(!m.has(k)) m.set(k,{key:k,qty:0,days:0,fc:false});
    const o=m.get(k); o.qty+=segs[i].rate; o.days++;
  }
  const lk = ym(end-DAY);
  if (forecastRate!=null && m.has(lk)){ const o=m.get(lk); if (o.days<dim(lk)){ o.fcQty=o.qty+forecastRate*(dim(lk)-o.days); o.fc=true; } }
  return [...m.values()].map(o=>({...o,label:ymLabel(o.key),dim:dim(o.key),partial:o.days<dim(o.key)}));
}
function meterCalc(M){
  const r=[...M.readings].sort((a,b)=>pd(a[0])-pd(b[0]));
  const ppu = M.priceUnit==='ct'? M.price/100 : M.price;
  const out={r,ppu,months:[]};
  if (r.length<2) return out;
  const segs=[]; for(let i=1;i<r.length;i++){ const t0=pd(r[i-1][0]),t1=pd(r[i][0]); if(t1>t0) segs.push({t0,t1,rate:(r[i][1]-r[i-1][1])/((t1-t0)/DAY)}); }
  if(!segs.length) return out;
  const t0=segs[0].t0,t1=segs[segs.length-1].t1;
  out.days=(t1-t0)/DAY; out.used=r[r.length-1][1]-r[0][1]; out.daily=out.used/out.days; out.year=out.daily*365;
  out.lastRate=segs[segs.length-1].rate;
  out.months=toMonths(segs,out.lastRate).map(o=>({...o,cost:o.qty*ppu+M.base/12*o.days/o.dim,norm:M.norm/365*o.days}));
  out.costTotal=out.used*ppu+M.base*out.days/365;
  out.yearCost=out.year*ppu+M.base;
  out.paid=M.abs*out.days/30.4375;
  return out;
}
function oilCalc(){
  const O=S.oil, toL=cm=>O.heightCm?cm/O.heightCm*O.tankL:0;
  const e=[...O.entries].sort((a,b)=>pd(a.d)-pd(b.d)||(a.cm!=null)-(b.cm!=null));
  const lv=e.filter(x=>x.cm!=null), fills=e.filter(x=>x.l);
  const out={e,lv,fills,toL,months:[]};
  const lastFill=fills[fills.length-1]; out.ppl=lastFill&&lastFill.eur?lastFill.eur/lastFill.l:null;
  if(lv.length) { out.nowL=toL(lv[lv.length-1].cm); out.nowD=lv[lv.length-1].d; }
  if(lv.length<2) return out;
  const segs=[];
  for(let i=1;i<lv.length;i++){
    const t0=pd(lv[i-1].d),t1=pd(lv[i].d); if(t1<=t0) continue;
    const added=fills.filter(f=>pd(f.d)>=t0&&pd(f.d)<=t1&&!(pd(f.d)===t0&&e.indexOf(f)<e.indexOf(lv[i-1]))).reduce((s,f)=>s+f.l,0);
    const used=Math.max(0,toL(lv[i-1].cm)+added-toL(lv[i].cm));
    segs.push({t0,t1,rate:used/((t1-t0)/DAY),used});
  }
  if(!segs.length) return out;
  out.used=segs.reduce((s,x)=>s+x.used,0); out.days=(segs[segs.length-1].t1-segs[0].t0)/DAY; out.daily=out.used/out.days;
  let u=0,dd=0; for(let i=segs.length-1;i>=0;i--){const s=segs[i];u+=s.used;dd+=(s.t1-s.t0)/DAY;if(dd>=60)break;}
  out.recent=u/dd; out.daysLeft=out.recent>0?out.nowL/out.recent:null;
  out.months=toMonths(segs,out.recent);
  return out;
}

/* ---------- shared pieces ---------- */
const field = (id,label,attrs='',cls='') => `<div class="field ${cls}"><label for="${id}">${label}</label><input id="${id}" ${attrs}></div>`;
const fig = (label,value,sub='',cls='',extra='') => `<div class="fig"><span class="cap">${label}</span><span class="v ${cls}">${value}</span>${sub?`<span class="cap">${sub}</span>`:''}${extra}</div>`;
const delBtn = (key,what) => `<button type="button" class="icon-btn" data-del="${esc(key)}" aria-label="Удалить ${esc(what)}">${icon('x')}</button>`;
const table = (head,rows,emptyText) => rows.length
  ? `<div class="tbl"><table><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
  : `<p class="empty">${emptyText}</p>`;
function odometer(value, unit){
  const dec = unit==='м³' ? 3 : 0;
  const parts = Math.max(0,value).toFixed(dec).split('.');
  const int = parts[0].padStart(dec?5:6,'0');
  const cells = [...int].map(d=>`<span>${d}</span>`).join('') + (dec?[...parts[1]].map(d=>`<span class="red">${d}</span>`).join(''):'');
  return `<div class="odo-row"><div class="odo" role="img" aria-label="Показание ${fmt(value,dec)} ${unit}">${cells}</div><span class="odo-u" aria-hidden="true">${unit}</span></div>`;
}

/* ---------- meter pages ---------- */
function meterView(id){
  const M=S.meters[id], c=meterCalc(M), u=M.unit, w=u==='м³', dp=w?2:0, rd=w?3:1;
  const last=c.r[c.r.length-1], prev=c.r[c.r.length-2];
  let hero = last

/* ---------- summary ---------- */
const SERIES=[['rent','Аренда','--s-rent'],['nk','Nebenkosten','--s-nk'],['power','Свет','--s-power'],['water','Вода','--s-water'],['oil','Масло','--s-oil']];
function summaryCalc(){
  const m=new Map(), part={}, add=(k,cat,v,partial)=>{if(!v)return;if(!m.has(k))m.set(k,{key:k});const o=m.get(k);o[cat]=(o[cat]||0)+v;if(partial)(part[cat]=part[cat]||new Set()).add(k);};
  for(const id of ['power','water']){const M=S.meters[id]; if(!M||M.nk) continue; meterCalc(M).months.forEach(o=>add(o.key,id,o.cost,o.partial));}
  if(!S.oil.nk){const c=oilCalc(); if(c.ppl) c.months.forEach(o=>add(o.key,'oil',o.qty*c.ppl,o.partial));}
  S.rent.payments.forEach(x=>add(ym(pd(x.d)),'rent',x.eur));
  S.nk.payments.forEach(x=>add(ym(pd(x.d)),'nk',x.eur));
  const keys=[...m.keys()]; if(!keys.length) return {months:[]};
  const lo=Math.min(...keys), hi=Math.max(...keys,nowK()), months=[];
  for(let k=lo;k<=hi;k++){const o=m.get(k)||{key:k}; o.total=SERIES.reduce((s,[c])=>s+(o[c]||0),0); o.label=ymLabel(k); months.push(o);}
  const full=months.filter(o=>o.key<nowK() && o.total>0);
  // each item is averaged over its own complete months: from its first to its last month with data,
  // skipping the current month and months a meter covers only partly
  const avg={}, span={};
  SERIES.forEach(([c])=>{
    const ks=months.filter(o=>o[c]&&o.key<nowK()&&!(part[c]&&part[c].has(o.key))).map(o=>o.key);
    if(!ks.length){avg[c]=0;return;}
    const a=Math.min(...ks), b=Math.max(...ks), inR=months.filter(o=>o.key>=a&&o.key<=b&&!(part[c]&&part[c].has(o.key)));
    avg[c]=inR.reduce((s,o)=>s+(o[c]||0),0)/inR.length; span[c]=inR.length;
  });
  avg.total=SERIES.reduce((s,[c])=>s+avg[c],0);
  return {months, full, avg, span};
}
function summaryView(){
  const c=summaryCalc();
  if(!c.months.length) return `<section class="card"><p class="empty">Расходов пока нет. Начните с вкладки «Свет» или внесите платёж аренды.</p></section>`;
  const y=today().slice(0,4), yearSum=c.months.filter(o=>String(Math.floor(o.key/12))===y).reduce((s,o)=>s+o.total,0);
  const cur=c.months.find(o=>o.key===nowK())||{total:0};
  const parts=SERIES.filter(([k])=>c.avg[k]>0);
  const via=[]; for(const id in S.meters) if(S.meters[id].nk) via.push(S.meters[id].name.toLowerCase()); if(S.oil.nk) via.push('масло');
  const used=SERIES.filter(([k])=>c.months.some(o=>o[k]));
  const rows=c.months.map(o=>`<tr><td>${o.label}</td>${used.map(([k])=>`<td>${o[k]?fmt(o[k]):'—'}</td>`).join('')}<td>${fmt(o.total)}</td></tr>`).reverse();
  return `
  <section class="card hero" aria-label="Средний месяц">
    ${c.full.length?`<p class="lead">Обычный месяц обходится в <span class="num">${eur(c.avg.total)}</span></p>
    <div class="comp" role="img" aria-label="Состав среднего месяца, подробности в списке ниже">${parts.map(([k,,v])=>`<i style="width:${c.avg[k]/c.avg.total*100}%;background:var(${v})"></i>`).join('')}</div>
    <ul class="legend">${parts.map(([k,l,v])=>`<li><span class="sw" style="background:var(${v})"></span><span>${l}</span><span class="num">${eur(c.avg[k])}</span><span class="cap num" style="width:3.2em;text-align:right">${fmt(c.avg[k]/c.avg.total*100)}%</span></li>`).join('')}</ul>
    <p class="note" style="margin-top:4px">Каждая статья усреднена по завершённым месяцам, за которые по ней есть данные, — поэтому месяцы без внесённой аренды не занижают итог.</p>`
    :`<p class="lead">Первый месяц ещё не закончился</p><p class="note" style="margin:0">Среднее появится, когда завершится хотя бы один месяц с данными.</p>`}
  </section>
  <section class="card figs" aria-label="Итоги">
    ${fig(`Всего в ${y}`,eur(yearSum),'включая текущий месяц')}
    ${fig(MONF[nowK()%12][0].toUpperCase()+MONF[nowK()%12].slice(1),eur(cur.total),'пока внесено')}
  </section>
  <section class="card"><h2>Расходы на дом по месяцам, €</h2><canvas id="ch" height="260" role="img" aria-label="Столбцы расходов по месяцам с разбивкой по статьям; те же числа в таблице ниже"></canvas>
  <p class="note">Свет, вода и масло — по расходу и цене. Аренда и Nebenkosten — по датам платежей.${via.length?` ${esc(via.join(', ')).replace(/^./,s=>s.toUpperCase())} ${via.length>1?'оплачиваются':'оплачивается'} через Nebenkosten и отдельно не считается, чтобы не учесть дважды.`:''}</p></section>
  <section class="card"><h2>По месяцам, €</h2>${table(['Месяц'].concat(used.map(s=>s[1])).concat(['Итого']),rows,'')}</section>`;
}
function summaryBind(){
  const c=summaryCalc(); if(!c.months.length) return;
  const ds=SERIES.filter(([k])=>c.months.some(o=>o[k])).map(([k,l,v])=>({label:l,data:c.months.map(o=>+(o[k]||0).toFixed(2)),color:css(v)}));
  barChart(c.months.map(o=>o.label),ds,c.full.length?{label:'Среднее',data:c.months.map(()=>+c.avg.total.toFixed(2))}:null,true);
}

/* ---------- chart ---------- */
function barChart(labels,series,line,stacked){
  if(!window.Chart||!$('ch')) return;
  const tx=css('--text-2'), grid=css('--border'), font={family:css('--font'),size:13,weight:'500'};
  const ds=series.map(s=>({label:s.label,data:s.data,backgroundColor:s.fc?s.fc.map(f=>f?s.color+'73':s.color):s.color,borderRadius:4,stack:stacked?'s':undefined,maxBarThickness:44}));
  if(line) ds.push({label:line.label,type:'line',data:line.data,borderColor:tx,borderDash:[6,4],borderWidth:2,pointRadius:0});
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  chart=new Chart($('ch'),{type:'bar',data:{labels,datasets:ds},options:{animation:rm?false:{duration:250},
    plugins:{legend:{display:ds.length>1,position:'bottom',labels:{color:tx,font,boxWidth:12,boxHeight:12,padding:14}},tooltip:{titleFont:font,bodyFont:{...font,size:14},callbacks:{label:x=>` ${x.dataset.label}: ${fmt(x.parsed.y,x.parsed.y<10?2:0)}`}}},
    scales:{x:{stacked,ticks:{color:tx,font,maxRotation:0,autoSkip:true,autoSkipPadding:8},grid:{display:false},border:{display:false}},y:{stacked,beginAtZero:true,ticks:{color:tx,font,callback:v=>fmt(v)},grid:{color:grid},border:{display:false}}}}});
}

/* ---------- app shell ---------- */
function setStatus(t,err){ $('status').textContent=t||''; $('status').className=err?'err':''; }
function delBind(fn,msg){
  $('view').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(b.dataset.sure){fn(b.dataset.del);save(msg);}
    else {b.dataset.sure=1;b.classList.add('confirm');b.textContent='Удалить?';setTimeout(()=>{if(b.isConnected&&b.dataset.sure){delete b.dataset.sure;b.classList.remove('confirm');b.innerHTML=icon('x');}},4000);}
  });
}
const TABS=[['sum','Итого'],['power','Свет'],['water','Вода'],['oil','Масло'],['rent','Аренда'],['nk','Nebenkosten']];
function render(){
  norm();
  if(!TABS.some(t=>t[0]===tab)) tab='sum';
  $('hdr').innerHTML=`<button class="link" id="logout" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text-2)">${icon('out')}Выйти</button>`;
  $('logout').onclick=logout;
  $('tabs').innerHTML=TABS.map(([id,l])=>`<button class="tab" data-t="${id}" ${id===tab?'aria-current="page"':''}>${icon(id)}${l}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;try{history.replaceState(null,'','#'+tab);}catch(e){}setStatus('');render();window.scrollTo(0,0);});
  if(chart){chart.destroy();chart=null;}
  if(tab==='sum'){$('view').innerHTML=summaryView();summaryBind();}
  else if(tab==='rent'||tab==='nk'){$('view').innerHTML=payView(tab);payBind(tab);}
  else if(tab==='oil'){$('view').innerHTML=oilView();oilBind();}
  else {$('view').innerHTML=meterView(tab);meterBind(tab);}
  const a=$('tabs').querySelector('[aria-current]'); if(a&&a.scrollIntoView) a.scrollIntoView({block:'nearest',inline:'nearest'});
}

/* ---------- API ---------- */
async function api(method, body){
  const r = await fetch('/api/state', {method, credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  if (r.status===401) { showLogin(); throw new Error('401'); }
  return r;
}
async function save(msg){
  render();
  setStatus('Сохраняю…');
  try{
    const r = await api('PUT', {rev: REV, data: S});
    if (r.status===409){ setStatus('Данные изменились на другом устройстве. Загрузил свежие — внесите запись ещё раз.',true); await load(true); return; }
    if (!r.ok) throw new Error('сервер ответил '+r.status);
    REV = (await r.json()).rev;
    setStatus(msg+' Сохранено.');
  }catch(e){ if(e.message!=='401') setStatus('Не сохранилось: '+e.message+'. Проверьте интернет и повторите.',true); }
}
async function load(keepStatus){
  try{
    const r = await api('GET');
    if (r.status===404){ REV=0; render(); setStatus('На сервере пока пусто — показаны начальные данные. Первое сохранение запишет их.'); return; }
    if (!r.ok) throw new Error('сервер ответил '+r.status);
    const j = await r.json(); S = j.data; REV = j.rev; render(); if(!keepStatus) setStatus('');
  }catch(e){ if(e.message!=='401') setStatus('Не удалось загрузить данные: '+e.message+'.',true); }
}
function showLogin(err){
  $('tabs').innerHTML=''; $('hdr').innerHTML=''; setStatus('');
  $('view').innerHTML=`<section class="card login"><h2>Вход</h2>
    <form id="f_login" class="entry" style="grid-template-columns:1fr">
      ${field('pw','Пароль','type="password" autocomplete="current-password" required autofocus')}
      <p class="cap ${err?'bad':''}" id="lerr" role="alert" style="margin:0">${err||'На этом устройстве вход сохранится на 90 дней.'}</p>
      <button class="btn" id="lbtn">Войти</button>
    </form></section>`;
  $('f_login').onsubmit=async e=>{e.preventDefault();
    $('lbtn').disabled=true; $('lbtn').textContent='Проверяю…';
    try{
      const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
      if(r.ok) load(); else showLogin(r.status===401?'Пароль не подошёл. Попробуйте ещё раз.':'Сервер ответил '+r.status+'. Попробуйте позже.');
    }catch(err){ showLogin('Нет связи с сервером. Проверьте интернет.'); }
  };
}
async function logout(){ try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'});}catch(e){} showLogin('Вы вышли.'); }
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==tab){tab=h;render();}});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if($('tabs').children.length) render(); });
load();
</script>
