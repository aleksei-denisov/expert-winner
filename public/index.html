<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DCDEDF">
<title>Дом: счётчики и расходы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">

<style>
/* design-system/home-meters/MASTER.md — v2 «Дом из цветных этажей» */
:root{
  --concrete:#DCDEDF;--power:#E8C547;--water:#2C5A8C;--oil:#9C4422;--rent:#2E6A54;--nk:#46505E;
  --s-power:var(--power);--s-water:var(--water);--s-oil:var(--oil);--s-rent:var(--rent);--s-nk:var(--nk);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
  --bad:#C1121F;--plate:#FFFFFF;--plate-ink:#000;--plate-line:#D5D8DA;--plate-mute:#3F4549;
  --display:'Unbounded',system-ui,sans-serif;--text:'Golos Text',system-ui,-apple-system,sans-serif;
  --c:var(--concrete);--on:#000;--tint:#EEEFF0;--dbar:#2B2E30;
  color-scheme:light;
}
body[data-w="power"]{--c:var(--power);--on:#000;--tint:#F6F0DA;--dbar:#7A6200}
body[data-w="water"]{--c:var(--water);--on:#fff;--tint:#E6ECF2;--dbar:var(--water)}
body[data-w="oil"]{--c:var(--oil);--on:#fff;--tint:#F3E9E4;--dbar:var(--oil)}
body[data-w="rent"]{--c:var(--rent);--on:#fff;--tint:#E5EEEA;--dbar:var(--rent)}
body[data-w="nk"]{--c:var(--nk);--on:#fff;--tint:#E8E9EC;--dbar:var(--nk)}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--plate:#1C1D1F;--plate-ink:#F2F2F2;--plate-line:#2F3134;--plate-mute:#C2C6CA;--bad:#FF7A7A}
  body[data-w]{--tint:#0E0F10;--page-ink:#F2F2F2}
  body[data-w="sum"]{--c:#26282A;--on:#F2F2F2;--dbar:#C2C6CA}
  body[data-w="power"]{--c:#3B3212;--on:#F2F2F2;--dbar:#E8C547}
  body[data-w="water"]{--c:#16293F;--on:#F2F2F2;--dbar:#6F9BD0}
  body[data-w="oil"]{--c:#3A1F14;--on:#F2F2F2;--dbar:#D9825C}
  body[data-w="rent"]{--c:#16302A;--on:#F2F2F2;--dbar:#6FB59A}
  body[data-w="nk"]{--c:#23282F;--on:#F2F2F2;--dbar:#A3AEBD}
  body{--s-water:#6F9BD0;--s-oil:#D9825C;--s-rent:#6FB59A;--s-nk:#A3AEBD}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;scroll-padding-bottom:190px}
.skip{position:absolute;left:12px;top:-60px;z-index:20;background:#000;color:#fff;padding:12px 16px;border-radius:8px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(12px + env(safe-area-inset-top))}
main:focus{outline:none}
@media (hover:hover){
  .btn:hover{filter:brightness(1.18)}
  .nav a:not([aria-current]):hover{background:#2A2C2E}
  .floor:hover{filter:brightness(1.1)}
  .link:hover,.switch a:hover{text-decoration-thickness:2px}
  .icon-btn:hover{background:var(--plate-line)}
  .switch a:not([aria-current]):hover{background:color-mix(in srgb,var(--on) 12%,transparent)}
}
.nav a:active,.floor:active,.icon-btn:active{filter:brightness(.92)}
body{--page:var(--tint);--ink:var(--page-ink,#000);--bar:var(--dbar);overflow-x:clip;margin:0;background:var(--page);color:var(--ink);font:400 16px/1.5 var(--text);font-variant-numeric:tabular-nums;transition:background-color .25s}
main{max-width:640px;margin:0 auto;padding:0 0 calc(168px + env(safe-area-inset-bottom))}
@media (min-width:700px){main{margin-top:var(--space-5)}.hero{border-radius:10px}}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--c) 45%,transparent);color:inherit}
.wrap{padding:0 max(20px,env(safe-area-inset-left)) 0 max(20px,env(safe-area-inset-right))}

/* hero band: the section colour, in both modes */
.hero{background:var(--c);color:var(--on);--ink:var(--on);padding:calc(var(--space-5) + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) var(--space-5) max(20px,env(safe-area-inset-left))}
.title{margin:0 0 var(--space-4)}
.title h1{font:600 clamp(30px,9.4vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.title span{display:block;font-weight:500;font-size:15px;margin-top:var(--space-2)}
.since{font-size:16px;font-weight:500;margin:var(--space-3) 0 0}
p{text-wrap:pretty}

/* mechanical counter */
.odo-row{display:flex;align-items:flex-end;gap:10px}
.odo{display:inline-flex;gap:4px;padding:7px;background:#000;border-radius:8px;flex:none}
.odo span{display:grid;place-items:center;width:clamp(30px,9vw,44px);height:clamp(46px,13.5vw,62px);background:linear-gradient(#1F2326 0 47%,#000 47% 53%,#1F2326 53%);border-radius:4px;color:#fff;font:600 clamp(22px,7vw,32px)/1 var(--display)}
.odo span.red{background:linear-gradient(#C1121F 0 47%,#6E0A12 47% 53%,#C1121F 53%)}
.odo-u{font:600 18px/1 var(--display);padding-bottom:8px}

/* plates */
.plate{background:var(--plate);color:var(--plate-ink);border-radius:8px;padding:var(--space-4) 18px 18px;margin:var(--space-4) 0}
.plate h2{font:600 17px/1.3 var(--display);margin:0 0 var(--space-3)}
.hero .plate{margin:var(--space-5) 0 0}
.mute{color:var(--plate-mute);font-size:14px;line-height:20px;font-weight:500}
.note{font-size:15px;line-height:22px;margin:12px 0 0}

/* forms */
form.entry{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.entry .full{grid-column:1/-1}
.entry-reading{grid-template-columns:1fr 1fr;align-items:end}
.entry-reading .btn{min-height:52px}
.entry-reading input#v{font:500 24px/28px var(--display);letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;line-height:20px;font-weight:600}
input[type=date]{font-size:16px;padding:12px 6px;min-width:0}
input,select{font:500 18px/24px var(--text);font-variant-numeric:tabular-nums;width:100%;min-height:52px;padding:12px;border:2px solid var(--plate-ink);border-radius:6px;background:var(--plate);color:var(--plate-ink);caret-color:var(--plate-ink)}
input::placeholder{color:var(--plate-mute);opacity:1;font-weight:400}
input[aria-invalid="true"]{border-color:var(--bad)}
.ferr{margin:2px 0 0;font-size:14px;line-height:20px;font-weight:600}
.ferr.bad{color:var(--bad)}.ferr.warn{color:var(--plate-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border:0;border-radius:999px;background:var(--plate-ink);color:var(--plate);font:600 17px/1 var(--text);cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--plate-ink);border:2px solid var(--plate-ink);min-height:48px}
.btn[disabled]{opacity:.6}
.hero .on-page .btn{background:var(--on);color:var(--c)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--plate-ink)}
.link{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}

/* Typenschild — the meter's type plate */
.tp{border:1.5px solid var(--ink);border-radius:8px;margin:var(--space-5) 0}
.tp-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3);padding:14px var(--space-4);border-top:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.tp-row:first-child{border-top:0}
.tp-row .l{font-size:16px;font-weight:500;line-height:1.35}
.tp-row .l small{display:block;font-size:14px;font-weight:500;margin-top:2px}
.tp-row .v{font:500 24px/1.15 var(--display);white-space:nowrap;text-align:right}
.tp-row .v small{font:600 15px var(--text)}
.tp-row.alert .v{color:var(--bad)}
.bad{color:var(--bad)}
.ruler{height:8px;border:1.5px solid var(--ink);border-radius:4px;margin-top:var(--space-2);overflow:hidden;width:min(200px,100%)}
.ruler i{display:block;height:100%;background:var(--ink)}
.empty-hint{font-size:17px;font-weight:500;margin:var(--space-5) 0}

/* sections on page */
.sec{margin:var(--space-6) 0 var(--space-4)}
.sec h2{font:600 18px/1.3 var(--display);margin:0 0 var(--space-3)}
.chart{position:relative;height:230px}

/* tables on plates */
.tbl{overflow-x:auto;margin:0 -18px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 18px 12px 0;text-align:right;font-size:16px;line-height:22px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:18px}
th{font-size:14px;font-weight:600;color:var(--plate-mute);border-bottom:2px solid var(--plate-ink)}
td{border-bottom:1px solid var(--plate-line)}
tr:last-child td{border-bottom:0}
td.t{text-align:left;white-space:normal;font-size:15px}
td.bad{color:var(--bad);font-weight:600}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;margin:-11px -10px -11px 0;border:0;background:none;color:var(--plate-ink);border-radius:6px;cursor:pointer}
.icon-btn.confirm{width:auto;padding:0 10px;color:var(--bad);font:600 15px/1 var(--text)}
details>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;cursor:pointer;font:600 17px var(--display)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);margin:0 6px 4px}
details[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}
.set .full{grid-column:1/-1}

/* the house */
.house-lead{font:600 26px/1.2 var(--display);margin-top:0;letter-spacing:-.01em;margin:0 0 var(--space-5);text-wrap:balance}
.house{position:relative;width:min(100%,360px);margin:0 auto}
.roof{position:relative;height:118px;margin:0 -12px}
.roof::before{content:"";position:absolute;inset:0;background:#26282A;clip-path:polygon(50% 0,100% 100%,0 100%)}
.roof b{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font:600 26px/1 var(--display)}
.chimney{position:absolute;right:22%;top:24px;width:26px;height:54px;background:#26282A}
.floors{display:flex;flex-direction:column;border:2px solid #26282A;border-top:0}
.floor{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;text-decoration:none;border-top:2px solid #26282A;transform-origin:bottom;min-height:52px}
.floor:first-child{border-top:0}
.floor .n{font:600 16px/1.2 var(--text)}
.floor .n small{display:block;font-size:14px;font-weight:500}
.floor .v{font:500 20px/1 var(--display);white-space:nowrap}
.floor.f-power{background:var(--power);color:#000}.floor.f-water{background:var(--water);color:#fff}.floor.f-oil{background:var(--oil);color:#fff}.floor.f-rent{background:var(--rent);color:#fff}.floor.f-nk{background:var(--nk);color:#fff}
.ground{height:8px;background:#26282A;margin:0 -12px;border-radius:2px}
@media (prefers-color-scheme:dark){.roof::before,.chimney,.ground{background:#C2C6CA}.roof b{color:#000}.floors,.floor{border-color:#C2C6CA}}
@keyframes rise{from{transform:scaleY(0)}to{transform:none}}
.house.animate .floor{animation:rise .45s cubic-bezier(.25,1,.5,1) both}
.house.animate .roof,.house.animate .chimney{animation:drop .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.mix{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:1px;min-width:90px;background:var(--plate-line)}
.mix i{display:block;height:100%}
.facts{font-size:17px;line-height:1.55;font-weight:500;margin:var(--space-5) 0 0}
.facts b{font:500 17px var(--display)}

/* payments */
.switch{display:flex;gap:6px;background:color-mix(in srgb,var(--on) 14%,transparent);padding:4px;border-radius:999px;margin:0 0 18px;width:max-content}
.switch a{min-height:44px;display:flex;align-items:center;padding:0 16px;border-radius:999px;color:var(--on);text-decoration:none;font-weight:600}
.switch a[aria-current]{background:var(--on);color:var(--c)}
.strip{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border:1.5px solid color-mix(in srgb,var(--on) 45%,transparent);border-radius:8px;font-size:14px;font-weight:600}
.mo .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:999px;border:1.5px dashed var(--on)}
.mo.paid{background:color-mix(in srgb,var(--on) 16%,transparent);border-color:transparent}
.mo.paid .ic{border:0;background:var(--on);color:var(--c)}
.mo.paid .ic svg{width:18px;height:18px;stroke-width:3}
.mo.before{border-style:dashed}.mo.before .ic{border-color:transparent}
.mo.now:not(.paid){border-color:var(--on);border-width:2px}

/* oil tank */
.tank-wrap{display:flex;gap:18px;align-items:stretch}
.tank{width:84px;min-height:150px;border:3px solid var(--on);border-radius:16px;position:relative;overflow:hidden;flex:none}
.tank i{position:absolute;left:0;right:0;bottom:0;background:var(--on)}
.tank-nums{display:flex;flex-direction:column;gap:4px;justify-content:center}
.big{font:500 32px/1.05 var(--display)}
.big small{font:600 16px var(--text)}

/* bottom bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#151617;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;justify-content:center}
.nav div{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:520px}
.nav a{--sw:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:56px;border-radius:10px;color:#fff;text-decoration:none;font:600 14px/1 var(--text)}
.nav a .sw{width:16px;height:16px;border-radius:3px;background:var(--sw);box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.nav a[aria-current]{background:var(--sw);color:var(--on-sw,#fff)}
.nav a[aria-current] .sw{box-shadow:0 0 0 2px currentColor}
.nav .n-sum{--sw:#4A4D50;--on-sw:#fff}.nav .n-power{--sw:var(--power);--on-sw:#000}.nav .n-water{--sw:var(--water)}.nav .n-oil{--sw:var(--oil)}.nav .n-pay{--sw:var(--rent)}
@media (prefers-color-scheme:dark){.nav .n-power{--sw:#E8C547}.nav .n-water{--sw:#2C5A8C}.nav .n-oil{--sw:#9C4422}.nav .n-pay{--sw:#2E6A54}}
.nav a:focus-visible{outline-color:#fff}

/* status toast above the bar */
#status{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));transition:opacity .2s;z-index:11;max-width:520px;margin:0 auto;padding:12px 16px;border-radius:10px;background:#000;color:#fff;font-size:15px;line-height:21px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#status:empty{display:none}
#status.err{background:var(--bad)}
#status.wait{background:#2B2E30}
#status .link{min-height:0;margin-left:6px;color:#fff}
@media (prefers-color-scheme:dark){#status{background:#F2F2F2;color:#000}#status .link{color:#000}#status.err{background:#FF7A7A;color:#000}}

.login{max-width:400px;margin:14vh auto 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:370px){form.entry,.set{grid-template-columns:1fr}.title h1{font-size:36px}.tp-row .v{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const pd = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); };

const ymLabel = k => MON[k%12]+' '+String(Math.floor(k/12)).slice(2);
const shortLabels = keys => keys.map((k,i)=>MON[k%12]+(i===0||k%12===0?' '+String(Math.floor(k/12)).slice(2):''));

const css = v => getComputedStyle(document.body).getPropertyValue(v).trim();

const IC = {

  water:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',

/* ---------- calculations (unchanged logic) ---------- */
function toMonths(segs, forecastRate){
  const m = new Map(); if (!segs.length) return [];
  const start = segs[0].t0, end = segs[segs.length-1].t1;
  let i = 0;
  for (let t=start; t<end; t+=DAY){
    while (t>=segs[i].t1) i++;
    const k=ym(t); if(!m.has(k)) m.set(k,{key:k,qty:0,days:0,fc:false});
    const o=m.get(k); o.qty+=segs[i].rate; o.days++;
  }
  const lk = ym(end-DAY);
  if (forecastRate!=null && m.has(lk)){ const o=m.get(lk); if (o.days<dim(lk)){ o.fcQty=o.qty+forecastRate*(dim(lk)-o.days); o.fc=true; } }
  return [...m.values()].map(o=>({...o,label:ymLabel(o.key),dim:dim(o.key),partial:o.days<dim(o.key)}));
}
function meterCalc(M){
  const r=[...M.readings].sort((a,b)=>pd(a[0])-pd(b[0]));
  const ppu = M.priceUnit==='ct'? M.price/100 : M.price;
  const out={r,ppu,months:[]};
  if (r.length<2) return out;
  const segs=[]; for(let i=1;i<r.length;i++){ const t0=pd(r[i-1][0]),t1=pd(r[i][0]); if(t1>t0) segs.push({t0,t1,rate:(r[i][1]-r[i-1][1])/((t1-t0)/DAY)}); }
  if(!segs.length) return out;
  const t0=segs[0].t0,t1=segs[segs.length-1].t1;
  out.days=(t1-t0)/DAY; out.used=r[r.length-1][1]-r[0][1]; out.daily=out.used/out.days; out.year=out.daily*365;
  out.lastRate=segs[segs.length-1].rate;
  out.months=toMonths(segs,out.lastRate).map(o=>({...o,cost:o.qty*ppu+M.base/12*o.days/o.dim,norm:M.norm/365*o.days}));
  out.costTotal=out.used*ppu+M.base*out.days/365;
  out.yearCost=out.year*ppu+M.base;
  out.paid=M.abs*out.days/30.4375;
  return out;
}
function oilCalc(){
  const O=S.oil, toL=cm=>O.heightCm?cm/O.heightCm*O.tankL:0;
  const e=[...O.entries].sort((a,b)=>pd(a.d)-pd(b.d)||(a.cm!=null)-(b.cm!=null));
  const lv=e.filter(x=>x.cm!=null), fills=e.filter(x=>x.l);
  const out={e,lv,fills,toL,months:[]};
  const lastFill=fills[fills.length-1]; out.ppl=lastFill&&lastFill.eur?lastFill.eur/lastFill.l:null;
  if(lv.length) { out.nowL=toL(lv[lv.length-1].cm); out.nowD=lv[lv.length-1].d; }
  if(lv.length<2) return out;
  const segs=[];
  for(let i=1;i<lv.length;i++){
    const t0=pd(lv[i-1].d),t1=pd(lv[i].d); if(t1<=t0) continue;
    const added=fills.filter(f=>pd(f.d)>=t0&&pd(f.d)<=t1&&!(pd(f.d)===t0&&e.indexOf(f)<e.indexOf(lv[i-1]))).reduce((s,f)=>s+f.l,0);
    const used=Math.max(0,toL(lv[i-1].cm)+added-toL(lv[i].cm));
    segs.push({t0,t1,rate:used/((t1-t0)/DAY),used});
  }
  if(!segs.length) return out;
  out.used=segs.reduce((s,x)=>s+x.used,0); out.days=(segs[segs.length-1].t1-segs[0].t0)/DAY; out.daily=out.used/out.days;
  let u=0,dd=0; for(let i=segs.length-1;i>=0;i--){const s=segs[i];u+=s.used;dd+=(s.t1-s.t0)/DAY;if(dd>=60)break;}
  out.recent=u/dd; out.daysLeft=out.recent>0?out.nowL/out.recent:null;
  out.months=toMonths(segs,out.recent);
  return out;
}

/* ---------- Платежи: Аренда / Nebenkosten ---------- */
// A standing order ("since" YYYY-MM + monthly) counts as paid on the 1st of every month up to now,
// unless a manual payment already exists for that month.
function allPayments(kind){
  const P=S[kind], out=[...P.payments];
  if(P.since && P.monthly){
    const [y,m]=P.since.split('-').map(Number);
    for(let k=y*12+m-1;k<=nowK();k++){
      if(P.payments.some(x=>ym(pd(x.d))===k)) continue;
      out.push({d:`${Math.floor(k/12)}-${String(k%12+1).padStart(2,'0')}-01`,eur:P.monthly,note:'автоматически',auto:true});
    }
  }
  return out;
}
function stripHTML(payments){
  const cur=nowK(), cells=[], first=payments.length?Math.min(...payments.map(x=>ym(pd(x.d)))):cur;
  for(let k=cur-5;k<=cur;k++){
    const paid=payments.filter(x=>ym(pd(x.d))===k).reduce((s,x)=>s+x.eur,0), before=!paid&&k<first;
    cells.push(`<li class="mo ${paid?'paid':''} ${before?'before':''} ${k===cur?'now':''}" aria-label="${MONF[k%12]} ${Math.floor(k/12)}: ${paid?'оплачено '+eur(paid,2):before?'до начала учёта':'нет платежа'}"><span class="ic">${paid?icon('check'):''}</span><span>${MON[k%12]}</span></li>`);
  }
  return `<ul class="strip">${cells.join('')}</ul>`;
}
function payView(kind){
  const P=S[kind], isRent=kind==='rent', p=allPayments(kind).sort((a,b)=>pd(a.d)-pd(b.d));
  const y=today().slice(0,4), inY=p.filter(x=>x.d.startsWith(y)), paidY=inY.reduce((s,x)=>s+x.eur,0);
  const cur=nowK(), paidNow=p.some(x=>ym(pd(x.d))===cur);
  const byYear={}; p.forEach(x=>{const k=x.d.slice(0,4);byYear[k]=(byYear[k]||0)+x.eur;});
  const Mon=MONF[cur%12][0].toUpperCase()+MONF[cur%12].slice(1);
  let tp=tpRow(Mon, paidNow?'оплачено':(P.monthly?'не оплачено':'—'), P.monthly?`${eur(P.monthly,2)} в месяц`:'сумма в месяц не задана', !paidNow&&P.monthly?'alert':'');
  tp+=tpRow(`Оплачено в ${y}`, eur(paidY), `${inY.length} ${plural(inY.length,'платёж','платежа','платежей')}`);
  let extra='';

function meterBind(id){
  const M=S.meters[id], c=meterCalc(M);
  const dp=M.unit==='м³'?3:0;
  $('v').oninput=()=>{fieldError('v','');delete $('f_read').dataset.confirm;
    const last=c.r[c.r.length-1], v=parseNum($('v').value), h=$('vhint'); if(!h||!last) return;
    if(v==null){h.textContent=`Прошлое показание — ${fmt(last[1],dp)} ${M.unit}, ${longDate(last[0])}.`;return;}
    const days=Math.max(1,Math.round((pd($('d').value||today())-pd(last[0]))/DAY)), dlt=v-last[1];
    h.textContent = dlt<0 ? `Это меньше прошлого показания (${fmt(last[1],dp)}).` : `+${fmt(dlt,dp)} ${M.unit} за ${days} ${DAYSG(days)} — ${fmt(dlt/days,dp?3:1)} в день${c.daily?`, обычно ${fmt(c.daily,dp?3:1)}`:''}.`;};
  $('f_read').onsubmit=e=>{e.preventDefault();const d=$('d').value,v=parseNum($('v').value);
    if(!d||v==null){fieldError('v','Введите число со счётчика.');return;}
    const before=c.r.filter(x=>pd(x[0])<pd(d)).pop(), after=c.r.find(x=>pd(x[0])>pd(d));
    if(before&&v<before[1]){fieldError('v',`Меньше показания от ${fd(before[0])} (${fmt(before[1],dp)}). Проверьте число.`);return;}
    if(after&&v>after[1]){fieldError('v',`Больше показания от ${fd(after[0])} (${fmt(after[1],dp)}). Проверьте дату или число.`);return;}
    if(before&&c.daily>0&&!$('f_read').dataset.confirm){const rate=(v-before[1])/Math.max(1,(pd(d)-pd(before[0]))/DAY);
      if(rate>c.daily*5){$('f_read').dataset.confirm=1;fieldError('v',`Это ${fmt(rate,dp?3:1)} ${M.unit} в день — в ${fmt(rate/c.daily)} раз больше обычного. Если всё верно, нажмите «Добавить показание» ещё раз.`,'warn');return;}}
    commit('Показание добавлено.',()=>{const m=S.meters[id];m.readings=m.readings.filter(x=>x[0]!==d);m.readings.push([d,v]);},'v');};
  delBind(d=>()=>{const m=S.meters[id];m.readings=m.readings.filter(x=>x[0]!==d);},'Показание удалено.');
  $('s_save').onclick=()=>{const t={price:numOr('s_price',M.price),base:numOr('s_base',M.base),norm:numOr('s_norm',M.norm),abs:numOr('s_abs',M.abs),nk:$('s_nk').checked};commit('Тариф сохранён.',()=>Object.assign(S.meters[id],t));};
  if(c.months.length){
    const full=c.months.filter(o=>!o.partial||o.fc);
    barChart(shortLabels(full.map(o=>o.key)).map((l,i)=>l+(full[i].fc?'*':'')),[{label:'Расход',data:full.map(o=>+(o.fc?o.fcQty:o.qty).toFixed(2)),color:css(id==='water'?'--s-water':'--s-power'),fc:full.map(o=>o.fc)}],
      M.norm?{label:'Норма',data:full.map(o=>+(M.norm/365*o.dim).toFixed(1))}:null,false);
  }
}

/* ---------- summary ---------- */
const SERIES=[['rent','Аренда','--s-rent'],['nk','Nebenkosten','--s-nk'],['power','Свет','--s-power'],['water','Вода','--s-water'],['oil','Масло','--s-oil']];
function summaryCalc(){
  const m=new Map(), part={}, add=(k,cat,v,partial)=>{if(!v)return;if(!m.has(k))m.set(k,{key:k});const o=m.get(k);o[cat]=(o[cat]||0)+v;if(partial)(part[cat]=part[cat]||new Set()).add(k);};
  for(const id of ['power','water']){const M=S.meters[id]; if(!M||M.nk) continue; meterCalc(M).months.forEach(o=>add(o.key,id,o.cost,o.partial));}
  if(!S.oil.nk){const c=oilCalc(); if(c.ppl) c.months.forEach(o=>add(o.key,'oil',o.qty*c.ppl,o.partial));}
  allPayments('rent').forEach(x=>add(ym(pd(x.d)),'rent',x.eur));
  allPayments('nk').forEach(x=>add(ym(pd(x.d)),'nk',x.eur));
  const keys=[...m.keys()]; if(!keys.length) return {months:[]};
  const lo=Math.min(...keys), hi=Math.max(...keys,nowK()), months=[];
  for(let k=lo;k<=hi;k++){const o=m.get(k)||{key:k}; o.total=SERIES.reduce((s,[c])=>s+(o[c]||0),0); o.label=ymLabel(k); months.push(o);}
  while(months.length>2 && months[0].total < 0.15*Math.max(...months.map(o=>o.total))) months.shift();   // drop a stub first month (e.g. 8 days of one meter)
  const full=months.filter(o=>o.key<nowK() && o.total>0);
  // each item is averaged over its own complete months: from its first to its last month with data,
  // skipping the current month and months a meter covers only partly
  const avg={}, span={};
  SERIES.forEach(([c])=>{
    const ks=months.filter(o=>o[c]&&o.key<nowK()&&!(part[c]&&part[c].has(o.key))).map(o=>o.key);
    if(!ks.length){avg[c]=0;return;}
    const a=Math.min(...ks), b=Math.max(...ks), inR=months.filter(o=>o.key>=a&&o.key<=b&&!(part[c]&&part[c].has(o.key)));
    avg[c]=inR.reduce((s,o)=>s+(o[c]||0),0)/inR.length; span[c]=inR.length;
  });
  avg.total=SERIES.reduce((s,[c])=>s+avg[c],0);
  return {months, full, avg, span};
}
function basis(k,n){ if(!n) return ''; const w=n+' '+plural(n,'месяц','месяца','месяцев'); return k==='oil'&&n<12?'по '+w+', отопление':'по '+w; }

  const maxT=Math.max(...c.months.map(o=>o.total));

      <div class="chimney" aria-hidden="true"></div>

      <div class="floors">${floors}</div>
      <div class="ground" aria-hidden="true"></div>
    </div>`:''}
    <p class="facts">В ${y} уже <b>${eur(yearSum)}</b>. В ${MONF[nowK()%12].replace(/ь$/,'е').replace(/й$/,'е').replace(/т$/,'те')} пока внесено <b>${eur(cur.total)}</b>.</p>
    <p class="note">Этаж — это статья, его высота — сколько она стоит в обычный месяц. Нажмите на этаж, чтобы открыть раздел.${c.span.oil&&c.span.oil<12?' Масло посчитано по отопительным месяцам — летом месяц выйдет дешевле.':''}</p>
  </header>
  ${chartBlock('Расходы по месяцам, €','Столбцы расходов по месяцам с разбивкой по статьям')}
  <div class="wrap">
    <p class="note" style="margin-top:-12px">Свет, вода и масло — по расходу и цене. Аренда и Nebenkosten — по датам платежей.${via.length?` ${esc(via.join(', ')).replace(/^./,s=>s.toUpperCase())} ${via.length>1?'оплачиваются':'оплачивается'} через Nebenkosten и отдельно не считается.`:''}</p>
    <section class="plate"><h2>По месяцам, €</h2>${table(['Месяц','Итого, €','Из чего'],rows,'')}<p class="note mute">Звёздочка — текущий месяц: в нём только то, что уже внесено. Цвета полосы — как этажи дома; точные суммы — в подсказке графика.</p></section>
    <p style="text-align:center;margin:28px 0 0"><button class="link" id="logout">Выйти</button></p>

/* ---------- chart ---------- */
function barChart(labels,series,line,stacked){
  if(!window.Chart||!$('ch')) return;
  const ink=css('--ink')||'#000', bar=css('--bar')||ink, font={family:css('--text'),size:13,weight:'600'};
  const grid=ink.toLowerCase()==='#fff'||ink.toLowerCase()==='#ffffff'?'rgba(255,255,255,.22)':'rgba(0,0,0,.18)';
  const ds=series.map(s=>{const col=stacked?s.color:bar; const fc=s.fc||labels.map(l=>/\*$/.test(l));
    return {label:s.label,data:s.data,backgroundColor:stacked?col:fc.map(f=>f?'transparent':col),borderColor:stacked?(css('--page')||'#000'):col,borderWidth:stacked?{top:2}:fc.map(f=>f?2.5:0),borderSkipped:stacked?'bottom':false,borderRadius:stacked?0:3,stack:stacked?'s':undefined,maxBarThickness:46};});
  if(line) ds.push({label:line.label,type:'line',data:line.data,borderColor:ink,borderDash:[6,5],borderWidth:2,pointRadius:0});
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  chart=new Chart($('ch'),{type:'bar',data:{labels,datasets:ds},options:{maintainAspectRatio:false,animation:rm?false:{duration:300},
    plugins:{legend:{display:ds.length>1,position:'bottom',labels:{color:ink,font,boxWidth:14,boxHeight:14,padding:14}},tooltip:{titleFont:font,bodyFont:{...font,size:14},callbacks:{label:x=>` ${x.dataset.label}: ${fmt(x.parsed.y,x.parsed.y<10?2:0)}`}}},
    scales:{x:{stacked,ticks:{color:ink,font,maxRotation:0,autoSkip:false},grid:{display:false},border:{color:ink,width:2}},y:{stacked,beginAtZero:true,ticks:{color:ink,font,callback:v=>fmt(v)},grid:{color:grid},border:{display:false}}}}});
}

let statusTimer;
function setStatus(t,kind,action){

function fieldError(id,msg,kind){
  const inp=$(id); if(!inp) return; let el=$(id+'-err');
  if(!el){el=document.createElement('p');el.id=id+'-err';el.className='ferr';inp.insertAdjacentElement('afterend',el);}
  el.textContent=msg; el.className='ferr '+(kind||'bad'); el.hidden=!msg;
  if(msg){inp.setAttribute('aria-invalid',kind==='warn'?'false':'true');inp.setAttribute('aria-describedby',id+'-err');inp.focus();}
  else {inp.removeAttribute('aria-invalid');}
}
function parseNum(v){ v=String(v||'').trim().replace(/\s/g,'').replace(',','.'); if(v==='') return null; const n=Number(v); return isFinite(n)?n:null; }
function numOr(id,fallback){ const n=parseNum($(id).value); return n==null?fallback:n; }
function delBind(fn,msg){

}

  if(chart){chart.destroy();chart=null;}
  if(tab==='sum'){$('view').innerHTML=summaryView();summaryBind();}
  else if(tab==='rent'||tab==='nk'){$('view').innerHTML=payView(tab);payBind(tab);}
  else if(tab==='oil'){$('view').innerHTML=oilView();oilBind();}
  else {$('view').innerHTML=meterView(tab);meterBind(tab);}
  if(lastFocus&&$(lastFocus)){const sec=$(lastFocus).closest('section');if(sec){sec.tabIndex=-1;sec.focus({preventScroll:true});}} lastFocus=null;
}

/* ---------- API ---------- */
async function api(method, body){
  const r = await fetch('/api/state', {method, credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  if (r.status===401) { showLogin(); throw new Error('401'); }
  return r;
}
let lastFocus=null, busy=false;
async function commit(msg, mutate, focusId, action){
  if(busy) return; busy=true;
  try{
    mutate(); lastFocus=focusId||null; render();
    document.querySelectorAll('#view form button').forEach(b=>b.disabled=true);
    await push(msg, mutate, action);
  } finally {
    busy=false; document.querySelectorAll('#view form button').forEach(b=>b.disabled=false);
  }
}
window.addEventListener('beforeunload',e=>{
  const dirty=[...document.querySelectorAll('#view form.entry input')].some(i=>i.type!=='date'&&i.type!=='password'&&i.value!==i.defaultValue);
  if(dirty){e.preventDefault();e.returnValue='';}
});
async function push(msg, mutate, action){
  setStatus('Сохраняю…');
  try{
    let r = await api('PUT', {rev: REV, data: S});
    if (r.status===409 && mutate){            // changed on another device: take fresh data, re-apply this change once
      const g = await api('GET'); const j = await g.json(); S=j.data; REV=j.rev; norm(); mutate(); render();
      r = await api('PUT', {rev: REV, data: S});
    }
    if (r.status===409){ await load(true); setStatus('Данные изменились на другом устройстве. Показаны свежие — проверьте последнюю запись.','err'); return; }
    if (!r.ok) throw new Error('server');
    REV = (await r.json()).rev; clearPending();
    setStatus(msg+' Сохранено.','ok',action);
  }catch(e){
    if(e.message==='401') return;
    keepPending();
    setStatus('Нет связи. Запись сохранена на телефоне — отправлю, когда появится интернет.','wait',{label:'Отправить сейчас',fn:retryPending});
  }
}
function keepPending(){ try{localStorage.setItem('home_pending',JSON.stringify({rev:REV,data:S}));}catch(e){} }
function clearPending(){ try{localStorage.removeItem('home_pending');}catch(e){} }
function getPending(){ try{return JSON.parse(localStorage.getItem('home_pending')||'null');}catch(e){return null;} }
async function retryPending(){ const p=getPending(); if(!p) return; S=p.data; REV=p.rev; render(); await push('Записи, внесённые без связи, отправлены.', null); }
async function load(keepStatus){
  try{
    const r = await api('GET');
    if (r.status===404){ REV=0; const p=getPending(); if(p&&p.rev===0){S=p.data;} render(); setStatus('На сервере пока пусто — показаны начальные данные. Первое сохранение запишет их.'); return; }
    if (!r.ok) throw new Error('server '+r.status);
    const j = await r.json(); S = j.data; REV = j.rev;
    const p=getPending();
    if(p && !keepStatus){ if(p.rev===REV){ S=p.data; render(); await push('Записи, внесённые без связи, отправлены.', null); return; } clearPending(); render(); setStatus('Записи, внесённые без связи, устарели: данные изменились на другом устройстве. Внесите их ещё раз.','err'); return; }
    render(); if(!keepStatus) setStatus('');
  }catch(e){ if(e.message!=='401') setStatus('Не удалось загрузить данные. Проверьте интернет и обновите страницу.',true); }
}
function showLogin(err){
  document.body.dataset.w='sum';
  $('tabs').innerHTML=''; $('hdr').innerHTML=''; setStatus('');
  $('view').innerHTML=`<section class="plate login"><h2>Вход</h2>
    <form id="f_login" class="entry" style="grid-template-columns:1fr">
      ${field('pw','Пароль','type="password" autocomplete="current-password" required')}
      <p class="mute ${err?'bad':''}" id="lerr" role="alert" style="margin:0">${err||'На этом устройстве вход сохранится на 90 дней.'}</p>
      <button class="btn" id="lbtn">Войти</button>
    </form></section>`;
  $('f_login').onsubmit=async e=>{e.preventDefault();
    $('lbtn').disabled=true; $('lbtn').textContent='Проверяю…';
    try{
      const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
      if(r.ok) load(); else showLogin(r.status===401?'Пароль не подошёл. Попробуйте ещё раз.':'Сервер сейчас не отвечает. Попробуйте через минуту.');
    }catch(err){ showLogin('Нет связи с сервером. Проверьте интернет.'); }
  };
}
async function logout(){ try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'});}catch(e){} showLogin('Вы вышли.'); }
window.addEventListener('online',()=>{ if(getPending()) retryPending(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&getPending()) retryPending(); });
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'sum';if(h!==tab){tab=h;setStatus('');render();window.scrollTo(0,0);}});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if($('tabs').children.length) render(); });
load();
</script>
